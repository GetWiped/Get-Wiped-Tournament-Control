name: Build GET WIPED CONTROL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract desktop project
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "GET-WIPED-CONTROL-Desktop-Starter.zip" `
            -DestinationPath "desktop-project" `
            -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: desktop-project/get-wiped-control-desktop
        run: npm install

      - name: Build Windows application
        working-directory: desktop-project/get-wiped-control-desktop
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: GET-WIPED-CONTROL-Windows
          path: |
            desktop-project/get-wiped-control-desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop-project/get-wiped-control-desktop/src-tauri/target/release/bundle/msi/*.msi
