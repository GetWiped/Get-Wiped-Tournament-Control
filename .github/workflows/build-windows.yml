name: Build GET WIPED CONTROL

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract desktop project
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "GET-WIPED-CONTROL-Desktop-Starter.zip" `
            -DestinationPath "desktop-project" `
            -Force

          $project = Get-ChildItem `
            -Path "desktop-project" `
            -Filter "package.json" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "package.json wurde im Desktop-Projekt nicht gefunden."
            exit 1
          }

          $projectDir = $project.Directory.FullName

          Write-Host "Desktop-Projekt gefunden:"
          Write-Host $projectDir

          "PROJECT_DIR=$projectDir" >> $env:GITHUB_ENV
      - name: Fix Tauri Windows installer mode
        shell: pwsh
        run: |
          $config = Get-ChildItem -Path "desktop-project" -Filter "tauri.conf.json" -Recurse -File | Select-Object -First 1
          if (-not $config) {
            Write-Error "tauri.conf.json nicht gefunden."
            exit 1
          }
          $json = Get-Content $config.FullName -Raw
          $json = $json -replace '"installMode"\s*:\s*"perUser"', '"installMode": "currentUser"'
          Set-Content -Path $config.FullName -Value $json -Encoding utf8
          Write-Host "Tauri installMode auf currentUser gesetzt."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm install

      - name: Build Windows application
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: GET-WIPED-CONTROL-Windows
          path: |
            desktop-project/**/target/release/bundle/nsis/*.exe
            desktop-project/**/target/release/bundle/msi/*.msi
